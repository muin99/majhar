<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Login</title>
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
    <div class="puro-page">
      <div class="chobi-ongsho">
        <img src="assets/hospital.jpg" alt="Hospital corridor" />
      </div>

      <div class="form-ongsho">
        <form
          id="login-form"
          action="login.php"
          method="post"
          onsubmit="return validateLogin();"
        >
          <input type="hidden" name="form-type" value="login" />
          <h1>Login</h1>
          <p>Please login to your account</p>

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />

          <button type="submit">Login</button>
          <p class="registration-link">
            Don't have an account?
            <a href="#" id="registration-dekhao" onclick="registration()"
              >Sign up</a
            >
          </p>
        </form>

        <form
          id="registration-form"
          action="login.php"
          method="post"
          onsubmit="return validateRegistration();"
        >
          <input type="hidden" name="form-type" value="registration" />
          <h1>Registration</h1>
          <p>Please create your account</p>

          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
          />

          <label for="register-email">Email</label>
          <input
            type="email"
            id="register-email"
            name="email"
            placeholder="Enter your email"
            required
          />

          <label for="role">Role</label>
          <select id="role" name="role" required>
            <option value="">Select your role</option>
            <option value="doctor">Doctor</option>
            <option value="patient">Patient</option>
            <option value="admin">Admin</option>
          </select>
          <label for="register-password">Password</label>
          <input
            type="password"
            id="register-password"
            name="password"
            placeholder="Enter your password"
            required
          />

          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Confirm your password"
            required
          />

          <button type="submit">Register</button>
          <p class="login-link">
            Already have an account?
            <a href="#" id="login-dekhao" onclick="login()">Login</a>
          </p>
        </form>
      </div>
    </div>
    <script src="scripts/index.js"></script>
  </body>
</html>
